<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#0a0a0a"/>
  <defs>
    <linearGradient id="beam1" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFE900" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFE900" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam2" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFE900" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFE900" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Architectural Beams -->
  <g filter="url(#glow)" opacity="0.8">
    <path d="M-100 0 L 700 0 L 500 1000 L -300 1000 Z" fill="url(#beam1)" />
    <path d="M1700 0 L 900 0 L 1100 1000 L 1900 1000 Z" fill="url(#beam1)" opacity="0.7" />
    <path d="M1600 200 L 0 400 L 0 500 L 1600 300 Z" fill="url(#beam2)" />
  </g>
  
  <!-- Subtle Grid -->
  <g opacity="0.05">
      <line x1="0" y1="200" x2="1600" y2="200" stroke="#F4F2EE" stroke-width="1"/>
      <line x1="0" y1="400" x2="1600" y2="400" stroke="#F4F2EE" stroke-width="1"/>
      <line x1="0" y1="600" x2="1600" y2="600" stroke="#F4F2EE" stroke-width="1"/>
      <line x1="0" y1="800" x2="1600" y2="800" stroke="#F4F2EE" stroke-width="1"/>
      <line x1="400" y1="0" x2="400" y2="1000" stroke="#F4F2EE" stroke-width="1"/>
      <line x1="800" y1="0" x2="800" y2="1000" stroke="#F4F2EE" stroke-width="1"/>
      <line x1="1200" y1="0" x2="1200" y2="1000" stroke="#F4F2EE" stroke-width="1"/>
  </g>
</svg>
