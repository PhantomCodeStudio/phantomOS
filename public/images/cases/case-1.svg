<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="1000" fill="#0a0a0a"/>
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#4169FF;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#4169FF;stop-opacity:0"/>
    </radialGradient>
    <filter id="noise" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
    </filter>
  </defs>
  
  <!-- Perspective Grid -->
  <g opacity="0.1">
    <path d="M800 500 L0 1000" stroke="#F4F2EE" stroke-width="1"/>
    <path d="M800 500 L1600 1000" stroke="#F4F2EE" stroke-width="1"/>
    <path d="M800 500 L800 1000" stroke="#F4F2EE" stroke-width="1"/>
    <path d="M0 600 H1600" stroke="#F4F2EE" stroke-width="0.5"/>
    <path d="M0 700 H1600" stroke="#F4F2EE" stroke-width="0.5"/>
    <path d="M0 850 H1600" stroke="#F4F2EE" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="600" y2="1000" stroke="#F4F2EE" stroke-width="0.5" />
    <line x1="1200" y1="0" x2="1000" y2="1000" stroke="#F4F2EE" stroke-width="0.5" />
  </g>

  <!-- Luminous Planes -->
  <rect x="200" y="300" width="600" height="400" fill="url(#grad1)" />
  <rect x="700" y="450" width="700" height="200" fill="url(#grad1)" opacity="0.7" transform="skewX(-20)" />
  
  <rect width="1600" height="1000" fill="black" opacity="0.05" filter="url(#noise)" />
</svg>
